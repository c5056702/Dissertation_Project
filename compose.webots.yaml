services:
  webots-validation:
    image: cyberbotics/webots:R2025a-ubuntu22.04
    init: true
    shm_size: "1gb"
    working_dir: /project
    environment:
      WEBOTS_EXECUTABLE: /usr/local/webots/webots
      LIBGL_ALWAYS_SOFTWARE: "1"
      ALSOFT_DRIVERS: "null"
      QT_X11_NO_MITSHM: "1"
    volumes:
      - .:/project
    entrypoint:
      - xvfb-run
      - -a
      - -s
      - -screen 0 1280x720x24
    command:
      - python3
      - tools/run_validation.py
      - --scenario
      - baseline_short
